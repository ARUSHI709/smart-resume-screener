<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Resume Screener</title><style>
body{font:16px system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f7f8fc;color:#152033}h1{margin-bottom:.2rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}section{background:#fff;padding:1.25rem;border-radius:12px;box-shadow:0 1px 4px #ccd}textarea,input{box-sizing:border-box;width:100%;padding:.65rem;margin:.4rem 0;border:1px solid #bdc7da;border-radius:6px}textarea{min-height:150px}button{background:#2d5bd1;color:#fff;padding:.65rem 1rem;border:0;border-radius:6px;font-weight:600;cursor:pointer}article{border-top:1px solid #dde3f0;padding:.8rem 0}.score{float:right;font-size:1.3rem;font-weight:bold;color:#2d5bd1}.muted{color:#5f6c80;font-size:.9rem}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>Smart Resume Screener</h1><p class="muted">Transparent, skills-first screening. Review results before making hiring decisions.</p><div class="grid"><section><h2>Add a resume</h2><input id="file" type="file" accept=".pdf,.txt"><textarea id="resume" placeholder="Or paste resume text here"></textarea><button onclick="addResume()">Parse and save</button><p id="upload"></p></section><section><h2>Screen candidates</h2><textarea id="job" placeholder="Paste the job description"></textarea><input id="minimum" type="number" min="0" max="10" value="0" step="0.5" aria-label="Minimum score"><button onclick="screen()">Rank candidates</button></section></div><section><h2>Results</h2><div id="results" class="muted">Add resumes and a job description to begin.</div></section><script>
async function addResume(){const file=document.querySelector('#file').files[0], text=document.querySelector('#resume').value, out=document.querySelector('#upload');let r;if(file){r=await fetch('/api/resumes',{method:'POST',headers:{'Content-Type':file.type||'text/plain','X-Filename':file.name},body:file})}else r=await fetch('/api/resumes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source_name:'pasted-resume.txt'})});const d=await r.json();out.textContent=r.ok?`Saved ${d.name}: ${d.skills.join(', ')||'no known skills identified'}`:d.error}
function element(tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;return el}
async function screen(){const r=await fetch('/api/screen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_description:document.querySelector('#job').value,minimum_score:+document.querySelector('#minimum').value})}),d=await r.json(),out=document.querySelector('#results');out.replaceChildren();if(!r.ok){out.textContent=d.error;return}if(!d.length){out.textContent='No candidates meet that threshold.';return}d.forEach(x=>{const card=document.createElement('article');card.append(element('span',`${x.score}/10`,'score'),element('strong',x.candidate.name),element('div',`${x.candidate.source_name} - ${x.scoring_method==='llm'?'LLM assessment':'rules fallback'}`,'muted'),element('p',x.justification));out.append(card)})}
</script></body></html>
